# .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: "nuget"            # NuGet packages in *.csproj
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      microsoft:
        patterns: [ "Microsoft.*", "System.*" ]

  - package-ecosystem: "github-actions"   # versions of actions in workflows
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"