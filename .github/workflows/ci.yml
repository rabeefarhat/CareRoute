# .github/workflows/ci.yml
name: ci                                    # ①

on:                                         # ②
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:                                # ③
  contents: read

concurrency:                                # ④
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:                                       # ⑤
    name: ci
    runs-on: ubuntu-latest                  # ⑥
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Check out the code
        uses: actions/checkout@v6           # ⑦

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6       # ⑧
        with:
          global-json-file: global.json

      - name: Restore packages
        run: dotnet restore CareRoute.slnx  # ⑨

      - name: Build (warnings are errors)
        run: dotnet build CareRoute.slnx --configuration Release --no-restore -warnaserror   # ⑩

      # Tests are added here in L05:
      # - name: Test
      #   run: dotnet test CareRoute.slnx --configuration Release --no-build